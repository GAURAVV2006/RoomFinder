{% extends "base.html" %}{% block content %}<section class="formbox wide"><small>NEW LISTING</small><h1>Add your property</h1><p>Your listing stays hidden until admin approval.</p><form method="post" enctype="multipart/form-data" id="propertyForm" class="form grid">
<label>Property title *<input name="title" required></label><label>City *<select name="city" id="citySelect" required><option value="">Select city</option><option>Nagpur</option><option>Pune</option><option>Mumbai</option></select></label>
<label>Area *<select name="area" id="areaSelect" required><option value="">Select area</option></select></label><label>Full address *<textarea name="address" required></textarea></label>
<label>Monthly rent (₹) *<input type="number" name="rent" min="1" required></label><label>Room type *<select name="room_type" required><option value="">Select</option>{% for t in ['Single Room','Double Room','Shared Room','1 BHK','2 BHK','PG'] %}<option>{{t}}</option>{% endfor %}</select></label>
<label class="span">Description<textarea name="description"></textarea></label><label class="span">Property photos *<input type="file" name="photos" accept=".jpg,.jpeg,.png,.webp" multiple required><small>JPG, PNG, WEBP · total upload max 12 MB</small></label><button class="btn span">Review and submit</button></form></section>
<div class="modal" id="confirmModal"><div><h2>Check your details</h2><p>Please make sure all property information and photos are correct.</p><button type="button" id="backBtn" class="btn mutedbtn">Back</button><button type="button" id="confirmBtn" class="btn">Submit</button></div></div>{% endblock %}
